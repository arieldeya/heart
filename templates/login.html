<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            background:#071120;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Segoe UI;
        }

        .login-box{
            background:#0f172a;
            padding:40px;
            border-radius:20px;
            width:350px;
            color:white;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:#1e293b;
            color:white;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#00ffd5;
            font-weight:bold;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Heart Disease AI</h1>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
